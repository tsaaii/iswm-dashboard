<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ISWM Dashboard{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body{% block bodyattrs %}{% endblock %}>
{% if user %}
<header class="top">
  <a class="brand" href="{{ url_for('overview') }}"><span class="mark" aria-hidden="true"></span>ISWM Dashboard</a>
  {% if demo %}<span class="pill demo" title="Made-up numbers and pictures. Set ISWM_API_URL to see real plants.">Demo data</span>{% endif %}
  <span class="spacer"></span>
  <span class="who">{{ user }}</span>
  <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="btn ghost">Log out</button></form>
</header>
{% endif %}
<main class="{% block mainclass %}wrap{% endblock %}">
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
